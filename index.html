<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163f35"><meta name="description" content="Nourish — your gentle daily calorie and habit tracker"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Nourish</title>
<style>
:root{--forest:#163f35;--green:#2e6a57;--mint:#cde8d8;--cream:#f7f5ed;--paper:#fffef9;--ink:#20332d;--muted:#728079;--line:#e4e9e1;--coral:#d98568}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:92px}button,input,select{font:inherit}button{cursor:pointer}.top{background:var(--forest);color:white;padding:calc(18px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 26px 26px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:13px;background:var(--mint);display:grid;place-items:center;color:var(--forest);font-size:24px}.brand h1{font-size:23px;margin:0;letter-spacing:-.7px}.date{font-size:13px;color:#d0e1d8;margin-top:5px}.greeting{font-size:25px;font-weight:750;letter-spacing:-.7px;margin:24px 0 5px}.sub{font-size:14px;color:#d0e1d8}.wrap{max-width:650px;margin:auto;padding:18px 16px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:0 3px 14px #163f3508}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.panel h2{font-size:17px;margin:0}.small{font-size:12px;color:var(--muted)}.calrow{display:flex;align-items:center;gap:20px}.ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:conic-gradient(var(--green) var(--p,0%),#e6ece5 0);position:relative}.ring:before{content:"";position:absolute;inset:9px;background:var(--paper);border-radius:50%}.ringinner{z-index:1;text-align:center}.big{font-size:27px;font-weight:800;letter-spacing:-1px}.ringlabel{font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}.stat{background:#f0f4ee;border-radius:13px;padding:10px 8px}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}.btn{border:0;border-radius:13px;padding:12px 15px;background:var(--forest);color:white;font-weight:650}.btn.secondary{background:var(--mint);color:var(--forest)}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.full{width:100%}.meal{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.meal:last-child{border-bottom:0}.mealicon{width:40px;height:40px;border-radius:13px;background:#edf4ec;display:grid;place-items:center;font-size:20px}.mealinfo{flex:1;min-width:0}.mealinfo b{display:block;font-size:14px;overflow-wrap:anywhere}.mealinfo span{font-size:12px;color:var(--muted)}.kcal{font-weight:750;font-size:14px;white-space:nowrap}.delete{background:none;border:0;color:#9b7569;font-size:20px;padding:5px}.habit{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}.habit:last-child{border:0}.check{width:25px;height:25px;border-radius:8px;border:1.5px solid #bdc9bf;background:white;display:grid;place-items:center;color:white;flex-shrink:0}.check.on{background:var(--green);border-color:var(--green)}.habittext{flex:1;font-size:14px}.habittext.done{text-decoration:line-through;color:var(--muted)}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:9px 8px calc(8px + env(safe-area-inset-bottom));background:#fffef9ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around}.tab{border:0;background:none;color:#7a8980;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:58px;padding:4px}.tab .ico{font-size:21px}.tab.active{color:var(--forest);font-weight:750}.sectiontitle{font-size:25px;font-weight:800;letter-spacing:-.8px;margin:5px 0 5px}.sectiondesc{font-size:13px;color:var(--muted);margin:0 0 17px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;color:#5e6d64;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #dce4db;border-radius:12px;background:white;color:var(--ink)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.foodrow{display:grid;grid-template-columns:1fr 90px;gap:10px}.empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:13px}.pill{background:var(--mint);color:var(--forest);font-size:11px;font-weight:700;padding:5px 8px;border-radius:20px}.bar{height:8px;background:#e7ece5;border-radius:9px;overflow:hidden;margin-top:8px}.bar span{height:100%;display:block;background:var(--green);border-radius:9px}.historyday{padding:13px 0;border-bottom:1px solid var(--line)}.historyday:last-child{border:0}.historyhead{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.muted{color:var(--muted)}.notice{font-size:12px;line-height:1.5;color:var(--muted);background:#f0f4ee;padding:11px;border-radius:12px}.toast{position:fixed;top:15px;left:15px;right:15px;background:var(--forest);color:white;padding:12px 15px;border-radius:13px;z-index:20;display:none}.danger{color:#a84f3a}.footerbuttons{display:flex;gap:9px;flex-wrap:wrap}
</style></head><body><header class="top"><div class="brand"><div class="logo">✳</div><div><h1>Nourish</h1><div class="date" id="todayDate"></div></div></div><div class="greeting" id="greeting">Small steps, every day.</div><div class="sub">Care for your body, one choice at a time.</div></header><main class="wrap" id="app"></main><nav class="tabs"><button class="tab active" data-tab="today"><span class="ico">◉</span>Today</button><button class="tab" data-tab="history"><span class="ico">▤</span>History</button><button class="tab" data-tab="habits"><span class="ico">✓</span>Habits</button><button class="tab" data-tab="profile"><span class="ico">☺</span>Profile</button></nav><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const iso=()=>new Date().toLocaleDateString('en-CA');const dayName=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});const defaults=()=>({profile:{name:'',sex:'male',age:22,height:178,weight:88,goal:'maintain',activity:1.2},target:2200,logs:{},habits:[{id:'water',name:'Drink enough water',emoji:'💧'},{id:'food',name:'Eat regular meals',emoji:'🥣'},{id:'walk',name:'Get some movement',emoji:'🚶'},{id:'sleep',name:'Wind down for sleep',emoji:'🌙'}],habitLogs:{}});let db;try{db=JSON.parse(localStorage.getItem('nourishDB'))||defaults()}catch(e){db=defaults()}let tab='today';let selectedDate=iso();function save(){localStorage.setItem('nourishDB',JSON.stringify(db))}function log(d=selectedDate){if(!db.logs[d])db.logs[d]=[];return db.logs[d]}function habits(d=iso()){if(!db.habitLogs[d])db.habitLogs[d]=[];return db.habitLogs[d]}function total(d=selectedDate){return log(d).reduce((a,f)=>a+Number(f.kcal||0),0)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#todayDate').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});$('#greeting').textContent=db.profile.name?`You've got this, ${db.profile.name}.`:'Small steps, every day.';if(tab==='today')today();if(tab==='history')history();if(tab==='habits')habitPage();if(tab==='profile')profilePage()}function today(){let t=total(),target=Number(db.target)||2000,p=Math.min(100,t/target*100),remaining=target-t;$('#app').innerHTML=`<section class="panel"><div class="panel-head"><h2>Today's calories</h2><span class="pill">${remaining>=0?remaining+' left':Math.abs(remaining)+' over'}</span></div><div class="calrow"><div class="ring" style="--p:${p}%"><div class="ringinner"><div class="big">${t.toLocaleString()}</div><div class="ringlabel">kcal eaten</div></div></div><div class="stats"><div class="stat"><b>${target.toLocaleString()}</b><span>Daily target</span></div><div class="stat"><b>${log().length}</b><span>Food entries</span></div><div class="stat"><b>${habits().length}/${db.habits.length}</b><span>Habits done</span></div></div></div><div class="bar"><span style="width:${p}%"></span></div></section><section class="panel"><div class="panel-head"><h2>Food diary</h2><span class="small">${dayName(selectedDate)}</span></div><form id="foodForm"><div class="field"><label for="foodName">What did you eat?</label><input id="foodName" required maxlength="90" placeholder="e.g. Chicken and rice"></div><div class="foodrow"><div class="field"><label for="foodKcal">Calories (kcal)</label><input id="foodKcal" required type="number" min="0" max="10000" inputmode="numeric" placeholder="450"></div><div class="field"><label for="mealType">Meal</label><select id="mealType"><option>Meal</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option><option>Drink</option></select></div></div><button class="btn full">＋ Add food</button></form><div style="margin-top:8px">${log().length?log().map((f,i)=>`<div class="meal"><div class="mealicon">${({Breakfast:'🍳',Lunch:'🥪',Dinner:'🍽️',Snack:'🍎',Drink:'🥤',Meal:'🥣'})[f.type]||'🥣'}</div><div class="mealinfo"><b>${esc(f.name)}</b><span>${esc(f.type||'Meal')}</span></div><div class="kcal">${Number(f.kcal).toLocaleString()} kcal</div><button class="delete" aria-label="Delete food" data-delete="${i}">×</button></div>`).join(''):'<div class="empty">Your diary is waiting. Add your first meal above.</div>'}</div></section><section class="panel"><div class="panel-head"><h2>Today's habits</h2><button class="btn secondary" id="goHabits">View all</button></div>${db.habits.slice(0,3).map(h=>habitRow(h)).join('')}</section>`;$('#foodForm').onsubmit=e=>{e.preventDefault();log().push({name:$('#foodName').value.trim(),kcal:Number($('#foodKcal').value),type:$('#mealType').value});save();render();toast('Added to your diary')};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{log().splice(Number(b.dataset.delete),1);save();render()});$('#goHabits').onclick=()=>{tab='habits';render()};bindChecks()}function habitRow(h){let done=habits().includes(h.id);return `<div class="habit"><button class="check ${done?'on':''}" data-habit="${h.id}" aria-label="Toggle ${esc(h.name)}">${done?'✓':''}</button><div class="habittext ${done?'done':''}">${h.emoji} &nbsp;${esc(h.name)}</div></div>`}function bindChecks(){document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{let id=b.dataset.habit,a=habits(),i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();render()})}function history(){let days=Object.keys(db.logs).filter(d=>db.logs[d]?.length).sort().reverse();$('#app').innerHTML=`<div class="sectiontitle">Your history</div><p class="sectiondesc">Look back at the days you've logged.</p><section class="panel"><div class="panel-head"><h2>Daily food log</h2><span class="small">${days.length} days logged</span></div>${days.length?days.map(d=>`<div class="historyday"><div class="historyhead"><span>${dayName(d)}</span><span>${total(d).toLocaleString()} kcal</span></div><div class="small">${db.logs[d].length} entries · target ${Number(db.target).toLocaleString()} kcal</div><div class="bar"><span style="width:${Math.min(100,total(d)/(Number(db.target)||2000)*100)}%"></span></div><button class="btn outline" style="margin-top:9px;padding:8px 11px" data-viewday="${d}">View this day</button></div>`).join(''):'<div class="empty">Your past days will appear here after you log food.</div>'}</section><section class="panel"><h2>Habit streak snapshot</h2><p class="small">Habits checked today: ${habits().length} of ${db.habits.length}</p></section>`;document.querySelectorAll('[data-viewday]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.viewday;tab='today';render();toast('Showing '+dayName(selectedDate))})}function habitPage(){$('#app').innerHTML=`<div class="sectiontitle">Daily habits</div><p class="sectiondesc">Progress, not perfection. Tick what you complete.</p><section class="panel"><div class="panel-head"><h2>For today</h2><span class="pill">${habits().length}/${db.habits.length} done</span></div>${db.habits.map(h=>habitRow(h)).join('')}<div class="bar"><span style="width:${db.habits.length?habits().length/db.habits.length*100:0}%"></span></div></section><section class="panel"><h2>Your habit list</h2><p class="small">Add habits that work for your routine.</p><form id="habitForm"><div class="field"><label for="habitName">New habit</label><input id="habitName" required maxlength="55" placeholder="e.g. Take a short walk"></div><button class="btn full">＋ Add habit</button></form>${db.habits.map(h=>`<div class="habit"><span style="font-size:20px">${h.emoji}</span><span class="habittext">${esc(h.name)}</span><button class="delete" data-delhabit="${h.id}" aria-label="Delete habit">×</button></div>`).join('')}</section>`;bindChecks();$('#habitForm').onsubmit=e=>{e.preventDefault();db.habits.push({id:'h'+Date.now(),name:$('#habitName').value.trim(),emoji:'🌱'});save();render();toast('Habit added')};document.querySelectorAll('[data-delhabit]').forEach(b=>b.onclick=()=>{db.habits=db.habits.filter(h=>h.id!==b.dataset.delhabit);Object.values(db.habitLogs).forEach(a=>{let i=a.indexOf(b.dataset.delhabit);if(i>=0)a.splice(i,1)});save();render()})}function calc(){let p=db.profile;let bmr=10*Number(p.weight)+6.25*Number(p.height)-5*Number(p.age)+(p.sex==='male'?5:-161);let maintenance=Math.round(bmr*Number(p.activity));return Math.max(1200,Math.round((p.goal==='lose'?maintenance-350:p.goal==='gain'?maintenance+250:maintenance)/50)*50)}function profilePage(){let p=db.profile;$('#app').innerHTML=`<div class="sectiontitle">Your profile</div><p class="sectiondesc">Personalise your calorie estimate and daily goal.</p><section class="panel"><form id="profileForm"><div class="field"><label for="pname">Name (optional)</label><input id="pname" maxlength="35" value="${esc(p.name)}" placeholder="What should we call you?"></div><div class="grid2"><div class="field"><label for="sex">Calculation setting</label><select id="sex"><option value="male" ${p.sex==='male'?'selected':''}>Male</option><option value="female" ${p.sex==='female'?'selected':''}>Female</option></select></div><div class="field"><label for="age">Age</label><input id="age" type="number" min="18" max="100" required value="${p.age}" inputmode="numeric"></div><div class="field"><label for="height">Height (cm)</label><input id="height" type="number" min="120" max="230" required value="${p.height}" inputmode="numeric"></div><div class="field"><label for="weight">Weight (kg)</label><input id="weight" type="number" min="30" max="350" required value="${p.weight}" step="0.1" inputmode="decimal"></div></div><div class="field"><label for="activity">Activity level</label><select id="activity"><option value="1.2" ${p.activity==1.2?'selected':''}>Mostly sitting / little exercise</option><option value="1.375" ${p.activity==1.375?'selected':''}>Lightly active</option><option value="1.55" ${p.activity==1.55?'selected':''}>Moderately active</option><option value="1.725" ${p.activity==1.725?'selected':''}>Very active</option></select></div><div class="field"><label for="goal">Goal</label><select id="goal"><option value="lose" ${p.goal==='lose'?'selected':''}>Lose weight gradually</option><option value="maintain" ${p.goal==='maintain'?'selected':''}>Maintain weight</option><option value="gain" ${p.goal==='gain'?'selected':''}>Gain weight</option></select></div><button class="btn full">Save profile & calculate</button></form></section><section class="panel"><div class="panel-head"><h2>Daily calorie target</h2><span class="pill">Estimate</span></div><div class="big">${Number(db.target).toLocaleString()} kcal</div><p class="small">Estimated using the Mifflin–St Jeor equation and your activity selection. This is a starting estimate, not medical advice.</p><button class="btn secondary full" id="recalc">Recalculate from profile</button><div class="field"><label for="customTarget">Or set your own daily target (kcal)</label><input id="customTarget" type="number" min="1000" max="6000" value="${db.target}" inputmode="numeric"></div><button class="btn outline full" id="customSave">Save custom target</button></section><section class="panel"><h2>Your data</h2><p class="small">Your information is stored in this browser on this device. Clearing website data can erase it, so export a backup occasionally.</p><div class="footerbuttons"><button class="btn secondary" id="export">Export backup</button><label class="btn outline" for="importFile">Import backup</label><input id="importFile" type="file" accept="application/json" hidden></div><p style="margin-top:14px"><button class="btn outline danger" id="reset">Reset all app data</button></p></section>`;$('#profileForm').onsubmit=e=>{e.preventDefault();Object.assign(p,{name:$('#pname').value.trim(),sex:$('#sex').value,age:Number($('#age').value),height:Number($('#height').value),weight:Number($('#weight').value),activity:Number($('#activity').value),goal:$('#goal').value});db.target=calc();save();render();toast('Profile saved')};$('#recalc').onclick=()=>{db.target=calc();save();render();toast('Calorie target updated')};$('#customSave').onclick=()=>{let n=Number($('#customTarget').value);if(n>=1000&&n<=6000){db.target=n;save();render();toast('Daily target saved')}else toast('Enter a target between 1,000 and 6,000')};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nourish-backup-'+iso()+'.json';a.click();URL.revokeObjectURL(url)};$('#importFile').onchange=async e=>{try{let imported=JSON.parse(await e.target.files[0].text());if(!imported.profile||!imported.logs)throw 0;db=imported;save();render();toast('Backup restored')}catch(err){toast('That backup file could not be read')}};$('#reset').onclick=()=>{if(confirm('Delete all Nourish data on this device? Export a backup first if you want to keep it.')){db=defaults();save();render();toast('App data reset')}}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
