<style>

ound:var(--forest);color:white;font-weight:650}.btn.secondary{background:var(--mint);color:var(--forest)}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.full{width:100%}.meal{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.meal:last-child{border-bottom:0}.mealicon{width:40px;height:40px;border-radius:13px;background:#edf4ec;display:grid;place-items:center;font-size:20px}.mealinfo{flex:1;min-width:0}.mealinfo b{display:block;font-size:14px;overflow-wrap:anywhere}.mealinfo span{font-size:12px;color:var(--muted)}.kcal{font-weight:750;font-size:14px;white-space:nowrap}.delete{background:none;border:0;color:#9b7569;font-size:20px;padding:5px}.habit{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}.habit:last-child{border:0}.check{width:25px;height:25px;border-radius:8px;border:1.5px solid #bdc9bf;background:white;display:grid;place-items:center;color:white;flex-shrink:0}.check.on{background:var(--green);border-color:var(--green)}.habittext{flex:1;font-size:14px}.habittext.done{text-decoration:line-through;color:var(--muted)}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:9px 8px calc(8px + env(safe-area-inset-bottom));background:#fffef9ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around}.tab{border:0;background:none;color:#7a8980;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:58px;padding:4px}.tab .ico{font-size:21px}.tab.active{color:var(--forest);font-weight:750}.sectiontitle{font-size:25px;font-weight:800;letter-spacing:-.8px;margin:5px 0 5px}.sectiondesc{font-size:13px;color:var(--muted);margin:0 0 17px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;color:#5e6d64;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #dce4db;border-radius:12px;background:white;color:var(--ink)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.foodrow{display:grid;grid-template-columns:1fr 90px;gap:10px}.empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:13px}.pill{background:var(--mint);color:var(--forest);font-size:11px;font-weight:700;padding:5px 8px;border-radius:20px}.bar{height:8px;background:#e7ece5;border-radius:9px;overflow:hidden;margin-top:8px}.bar span{height:100%;display:block;background:var(--green);border-radius:9px}.historyday{padding:13px 0;border-bottom:1px solid var(--line)}.historyday:last-child{border:0}.historyhead{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.muted{color:var(--muted)}.notice{font-size:12px;line-height:1.5;color:var(--muted);background:#f0f4ee;padding:11px;border-radius:12px}.toast{position:fixed;top:15px;left:15px;right:15px;background:var(--forest);color:white;padding:12px 15px;border-radius:13px;z-index:20;display:none}.danger{color:#a84f3a}.footerbuttons{display:flex;gap:9px;flex-wrap:wrap}.macrogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.macrobox{background:#f0f4ee;border-radius:12px;padding:10px 7px;text-align:center}.macrobox b{display:block;font-size:17px}.macrobox span{font-size:10px;color:var(--muted)}.uploadbox{border:1.5px dashed #b8cbbd;border-radius:15px;padding:14px;text-align:center;background:#fbfcf8}.uploadbox img{display:block;max-width:100%;max-height:220px;margin:12px auto 0;border-radius:12px}.airesult{background:#f0f4ee;border-radius:15px;padding:14px;margin-top:12px}.airesult h3{margin:0 0 5px;font-size:16px}.tagrow{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;background:#e3eee4;border-radius:20px;padding:5px 8px;color:var(--forest)}.coachmessages{display:flex;flex-direction:column;gap:9px;max-height:300px;overflow:auto;margin:12px 0}.chatbubble{padding:11px 13px;border-radius:14px;font-size:13px;line-height:1.5;white-space:pre-line;max-width:94%}.chatbubble.bot{background:#edf4ec;align-self:flex-start}.chatbubble.user{background:var(--forest);color:white;align-self:flex-end}.moneycards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.moneycard{padding:13px;border-radius:14px;background:#f0f4ee;min-width:0}.moneycard span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.moneycard b{font-size:20px;overflow-wrap:anywhere}.moneycard.negative b{color:#a84f3a}.transaction{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.transaction:last-child{border-bottom:0}.transactionicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#edf4ec;font-size:19px;flex-shrink:0}.transactioninfo{flex:1;min-width:0}.transactioninfo b{display:block;font-size:13px;overflow-wrap:anywhere}.transactioninfo span{font-size:11px;color:var(--muted)}.transactionamount{font-weight:750;white-space:nowrap;font-size:13px}.transactionamount.income{color:#2e6a57}.tabs{overflow-x:auto;justify-content:space-between;gap:0}.tab{flex:1 0 54px}.tab .ico{line-height:1.1}@media(max-width:380px){.tab{min-width:52px;font-size:10px}.tab .ico{font-size:19px}.macrogrid{gap:5px}.macrobox{padding:8px 4px}.macrobox b{font-size:15px}}
</style></head><body><header class="top"><div class="brand"><div class="logo">✳</div><div><h1>Nourish</h1><div class="date" id="todayDate"></div></div></div><div class="greeting" id="greeting">Small steps, every day.</div><div class="sub">Care for your body, one choice at a time.</div></header><main class="wrap" id="app"></main><nav class="tabs"><button class="tab active" data-tab="today"><span class="ico">◉</span>Today</button><button class="tab" data-tab="history"><span class="ico">▤</span>History</button><button class="tab" data-tab="habits"><span class="ico">✓</span>Habits</button><button class="tab" data-tab="ai"><span class="ico">✦</span>AI Coach</button><button class="tab" data-tab="money"><span class="ico">€</span>Money</button><button class="tab" data-tab="profile"><span class="ico">☺</span>Profile</button></nav><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const iso=()=>new Date().toLocaleDateString('en-CA');const dayName=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});const defaults=()=>({profile:{name:'',sex:'male',age:22,height:178,weight:88,goal:'maintain',activity:1.2},target:2200,logs:{},habits:[{id:'water',name:'Drink enough water',emoji:'💧'},{id:'food',name:'Eat regular meals',emoji:'🥣'},{id:'walk',name:'Get some movement',emoji:'🚶'},{id:'sleep',name:'Wind down for sleep',emoji:'🌙'}],habitLogs:{},aiChats:[],money:{transactions:[],monthlyBudget:0,startingBalance:0}});let db;try{db=JSON.parse(localStorage.getItem('nourishDB'))||defaults()}catch(e){db=defaults()}db.profile=db.profile||defaults().profile;db.logs=db.logs||{};db.habits=db.habits||defaults().habits;db.habitLogs=db.habitLogs||{};db.aiChats=db.aiChats||[];db.money=db.money||{transactions:[],monthlyBudget:0,startingBalance:0};db.money.transactions=db.money.transactions||[];db.money.monthlyBudget=Number(db.money.monthlyBudget)||0;db.money.startingBalance=Number(db.money.startingBalance)||0;let tab='today';let selectedDate=iso();function save(){localStorage.setItem('nourishDB',JSON.stringify(db))}function log(d=selectedDate){if(!db.logs[d])db.logs[d]=[];return db.logs[d]}function habits(d=iso()){if(!db.habitLogs[d])db.habitLogs[d]=[];return db.habitLogs[d]}function total(d=selectedDate){return log(d).reduce((a,f)=>a+Number(f.kcal||0),0)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#todayDate').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});$('#greeting').textContent=db.profile.name?`You've got this, ${db.profile.name}.`:'Small steps, every day.';if(tab==='today')today();if(tab==='history')history();if(tab==='habits')habitPage();if(tab==='ai')aiPage();if(tab==='profile')profilePage()}function today(){let t=total(),target=Number(db.target)||2000,p=Math.min(100,t/target*100),remaining=target-t;$('#app').innerHTML=`<section class="panel"><div class="panel-head"><h2>Today's calories</h2><span class="pill">${remaining>=0?remaining+' left':Math.abs(remaining)+' over'}</span></div><div class="calrow"><div class="ring" style="--p:${p}%"><div class="ringinner"><div class="big">${t.toLocaleString()}</div><div class="ringlabel">kcal eaten</div></div></div><div class="stats"><div class="stat"><b>${target.toLocaleString()}</b><span>Daily target</span></div><div class="stat"><b>${log().length}</b><span>Food entries</span></div><div class="stat"><b>${habits().length}/${db.habits.length}</b><span>Habits done</span></div></div></div><div class="bar"><span style="width:${p}%"></span></div></section><section class="panel"><div class="panel-head"><h2>Food diary</h2><span class="small">${dayName(selectedDate)}</span></div><form id="foodForm"><div class="field"><label for="foodName">What did you eat?</label><input id="foodName" required maxlength="90" placeholder="e.g. Chicken and rice"></div><div class="foodrow"><div class="field"><label for="foodKcal">Calories (kcal)</label><input id="foodKcal" required type="number" min="0" max="10000" inputmode="numeric" placeholder="450"></div><div class="field"><label for="mealType">Meal</label><select id="mealType"><option>Meal</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option><option>Drink</option></select></div></div><button class="btn full">＋ Add food</button></form><div style="margin-top:8px">${log().length?log().map((f,i)=>`<div class="meal"><div class="mealicon">${({Breakfast:'🍳',Lunch:'🥪',Dinner:'🍽️',Snack:'🍎',Drink:'🥤',Meal:'🥣'})[f.type]||'🥣'}</div><div class="mealinfo"><b>${esc(f.name)}</b><span>${esc(f.type||'Meal')}${f.p!=null?` · P ${Math.round(f.p)}g · C ${Math.round(f.c||0)}g · F ${Math.round(f.f||0)}g`:``}</span></div><div class="kcal">${Number(f.kcal).toLocaleString()} kcal</div><button class="delete" aria-label="Delete food" data-delete="${i}">×</button></div>`).join(''):'<div class="empty">Your diary is waiting. Add your first meal above.</div>'}</div></section><section class="panel"><div class="panel-head"><h2>Today's habits</h2><button class="btn secondary" id="goHabits">View all</button></div>${db.habits.slice(0,3).map(h=>habitRow(h)).join('')}</section>`;$('#foodForm').onsubmit=e=>{e.preventDefault();log().push({name:$('#foodName').value.trim(),kcal:Number($('#foodKcal').value),type:$('#mealType').value});save();render();toast('Added to your diary')};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{log().splice(Number(b.dataset.delete),1);save();render()});$('#goHabits').onclick=()=>{tab='habits';render()};bindChecks()}function habitRow(h){let done=habits().includes(h.id);return `<div class="habit"><button class="check ${done?'on':''}" data-habit="${h.id}" aria-label="Toggle ${esc(h.name)}">${done?'✓':''}</button><div class="habittext ${done?'done':''}">${h.emoji} &nbsp;${esc(h.name)}</div></div>`}function bindChecks(){document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{let id=b.dataset.habit,a=habits(),i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();render()})}
const foodData=[
{name:'Chicken breast, cooked',aliases:['chicken','chicken breast','grilled chicken'],kcal:165,p:31,c:0,f:3.6},
{name:'White rice, cooked',aliases:['rice','white rice'],kcal:130,p:2.7,c:28,f:.3},
{name:'Pasta, cooked',aliases:['pasta','spaghetti','penne'],kcal:158,p:5.8,c:30.9,f:.9},
{name:'Egg, whole',aliases:['egg','eggs'],kcal:155,p:13,c:1.1,f:11},
{name:'White bread',aliases:['bread','toast','white toast'],kcal:265,p:9,c:49,f:3.2},
{name:'Oats, dry',aliases:['oats','porridge','oatmeal'],kcal:389,p:16.9,c:66.3,f:6.9},
{name:'Banana',aliases:['banana'],kcal:89,p:1.1,c:22.8,f:.3},

{name:'Beef mince, cooked',aliases:['beef','mince','beef mince'],kcal:250,p:26,c:0,f:15},

{name:'Whole milk',aliases:['milk'],kcal:61,p:3.2,c:4.8,f:3.3},
{name:'Peanut butter',aliases:['peanut butter'],kcal:588,p:25,c:20,f:50},
{name:'Oven chips',aliases:['chips','fries','oven chips'],kcal:180,p:3,c:28,f:6},
{name:'Pizza',aliases:['pizza'],kcal:266,p:11,c:33,f:10},
{name:'Burger, beef',aliases:['burger','beef burger'],kcal:295,p:17,c:24,f:14},
{name:'Broccoli',aliases:['broccoli'],kcal:35,p:2.4,c:7.2,f:.4},
{name:'Baked beans',aliases:['beans','baked beans'],kcal:82, p:4.8,c:14,f:.5}
];

function macroTotals(d=selectedDate){return log(d).reduce((a,f)=>({p:a.p+Number(f.p||0),c:a.c+Number(f.c||0),f:a.f+Number(f.f||0)}),{p:0,c:0,f:0})}
function macroBoxes(m){return `<div class="macrogrid"><div class="macrobox"><b>${Math.round(m.p)}g</b><span>PROTEIN</span></div><div class="macrobox"><b>${Math.round(m.c)}g</b><span>CARBS</span></div><div class="macrobox"><b>${Math.round(m.f)}g</b><span>FAT</span></div><div class="macrobox"><b>${Math.round(m.p*4+m.c*4+m.f*9)}</b><span>MACRO KCAL</span></div></div>`}
function coachReply(question){const q=question.toLowerCase(),todayTotal=total(),target=Number(db.target)||2200,entries=log(),m=macroTotals(),profile=db.profile;const foods=foodData;let answer='I can help with calories, protein, meal ideas, habits and your progress. Try asking “How am I doing today?”, “What can I eat for protein?”, or “Give me a cheap meal idea.”';if(/how am i doing|today|progress|calories left|calorie target/.test(q)){const left=target-todayTotal;answer=`Today's check-in: you've logged ${todayTotal.toLocaleString()} kcal against your ${target.toLocaleString()} kcal target. ${left>=0?`${left.toLocaleString()} kcal remain.`:`You're ${Math.abs(left).toLocaleString()} kcal over the target.`}\nYou've logged ${entries.length} food ${entries.length===1?'entry':'entries'} today. ${m.p?`Your logged macros are about ${Math.round(m.p)}g protein, ${Math.round(m.c)}g carbs and ${Math.round(m.f)}g fat.`:''}\nOne day doesn't define progress. Use the target as a guide, not a pass/fail score.`}else if(/protein|high.?protein|muscle/.test(q)){const high=foods.filter(f=>f.p>=15).sort((a,b)=>b.p-b.p).slice(0,5);answer=`Easy protein options from the food list (per 100g, approximate):\n${high.map(f=>`• ${f.name}: ${f.p}g protein, ${f.kcal} kcal`).join('\n')}\nFor a meal, combine one protein source with a filling carbohydrate and fruit or vegetables. Your needs depend on your goals and health.`}else if(/cheap|budget|afford|money|low cost|inexpensive/.test(q)){answer='Budget-friendly food ideas: oats for breakfast; eggs or beans on toast; rice with chicken or beans; pasta with a simple tomato sauce; potatoes with eggs or beans; and frozen vegetables. Compare the price per portion, use leftovers safely, and choose foods you will actually enjoy eating.'}else if(/meal plan|plan my meals|what should i eat|meal idea|ideas for food/.test(q)){const need= Math.max(0,target-todayTotal);answer=`A simple flexible day (adjust portions to your appetite and budget):\n• Breakfast: oats with milk and banana.\n• Lunch: eggs or chicken with toast/rice and some vegetables.\n• Dinner: rice or potatoes with chicken, beans, eggs or another protein.\n• Snack: yoghurt, fruit or toast if you're hungry.\nYou have about ${need.toLocaleString()} kcal remaining against your current target, but this is only a rough guide. Tell me what food you have available and I can narrow it down.`}else if(/lose weight|fat loss|weight loss|calorie deficit/.test(q)){answer=`For gradual weight loss, consistency matters more than a perfect day. Your current app target is ${target.toLocaleString()} kcal/day. Prioritise regular meals, protein-containing foods, fibre, and portions you can sustain. Avoid extreme restriction; calorie estimates and targets are only guides, not medical advice.`}else if(/gain weight|appetite|eat more|can't eat|cant eat/.test(q)){answer='If eating feels difficult, try smaller, more frequent meals rather than forcing one huge meal. Easy options include toast, yoghurt, milk, oats, eggs, rice or a smoothie. Add energy-dense extras you tolerate, such as peanut butter or olive oil. If poor appetite or nausea persists, or you are losing weight unintentionally, please speak with a GP.'}else if(/habit|motivat|routine|streak/.test(q)){const done=habits().length;answer=`You've checked off ${done} of ${db.habits.length} habits today. Pick just one small next action: drink some water, have a regular meal, take a short walk if safe, or start winding down for sleep. A missed habit is information, not failure.`}else if(/photo|picture|image|scan/.test(q)){answer='You can add a photo in the Food Estimator below, but this version does not analyse images automatically. Type the food name and portion to estimate nutrition from the built-in reference list. I won’t pretend to identify a food from a photo when no vision model is connected.'}else if(/hello|hi |hey/.test(q)){answer=`Hey${profile.name?`, ${profile.name}`:''}! I'm your Nourish Coach. I can use your logged calories and food reference list to help with nutrition, meal ideas and habits. What would you like help with?`}return answer}
function aiPage(){let m=macroTotals();const chats=db.aiChats||[];$('#app').innerHTML=`<div class="sectiontitle">Nourish AI Coach ✦</div><p class="sectiondesc">A dedicated helper for food, calories, meal ideas and habits. It uses your logged data and built-in nutrition references.</p><section class="panel"><div class="panel-head"><h2>Ask Nourish</h2><span class="pill">Smart coach</span></div><div class="coachmessages" id="coachMessages">${(chats.length?chats:[{role:'bot',text:'Hi! Ask me how your day is going, for protein ideas, a simple meal plan, or help building habits.'}]).map(c=>`<div class="chatbubble ${c.role==='user'?'user':'bot'}">${esc(c.text)}</div>`).join('')}</div><form id="coachForm"><div class="field"><label for="coachQuestion">What do you want help with?</label><input id="coachQuestion" maxlength="500" required placeholder="e.g. Give me a cheap high-protein meal"></div><button class="btn full">Ask Nourish ✦</button></form><div class="tagrow" style="margin-top:12px"><button class="tag" data-ask="How am I doing today?">Today's progress</button><button class="tag" data-ask="Give me cheap meal ideas">Cheap meals</button><button class="tag" data-ask="What are good protein foods?">Protein ideas</button></div><p class="small" style="margin-top:12px">This assistant works offline using rules and your app data. It is not connected to a full online AI model yet; real generative AI and automatic photo recognition require a secure service connection.</p></section><section class="panel"><div class="panel-head"><h2>Today's macros</h2><span class="pill">From logged meals</span></div>${macroBoxes(m)}<p class="small">Only entries with macro data are included. Estimates are approximate.</p></section><section class="panel"><div class="panel-head"><h2>Food estimator</h2><span class="pill">Nutrition lookup</span></div><div class="uploadbox"><div style="font-size:30px">📷</div><b>Add a food photo</b><p class="small">Photo preview only in this version. Enter the food name below for an estimate.</p><input id="foodPhoto" type="file" accept="image/*" capture="environment" style="max-width:100%;font-size:12px"><img id="photoPreview" hidden alt="Selected food preview"></div><div class="field"><label for="aiFood">Food or meal</label><input id="aiFood" list="foodOptions" placeholder="e.g. chicken, rice, banana"><datalist id="foodOptions">${foodData.map(f=>`<option value="${esc(f.name)}">`).join('')}</datalist></div><div class="grid2"><div class="field"><label for="aiGrams">Portion (grams)</label><input id="aiGrams" type="number" min="1" max="3000" value="150" inputmode="numeric"></div><div class="field"><label for="aiMealType">Meal type</label><select id="aiMealType"><option>Meal</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option><option>Drink</option></select></div></div><button class="btn full" id="estimateFood">Estimate nutrition</button><div id="aiOutput"></div></section><section class="panel"><h2>Quick food lookup</h2><p class="small">Tap a food to fill in the estimator.</p><div class="tagrow">${foodData.slice(0,14).map(f=>`<button class="tag" data-pickfood="${esc(f.name)}" style="border:0">${esc(f.name)}</button>`).join('')}</div></section>`;
const submitQuestion=q=>{q=String(q||'').trim();if(!q)return;db.aiChats=db.aiChats||[];db.aiChats.push({role:'user',text:q});db.aiChats.push({role:'bot',text:coachReply(q)});db.aiChats=db.aiChats.slice(-20);save();aiPage();const box=$('#coachMessages');if(box)box.scrollTop=box.scrollHeight};$('#coachForm').onsubmit=e=>{e.preventDefault();submitQuestion($('#coachQuestion').value)};document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>submitQuestion(b.dataset.ask));$('#foodPhoto').onchange=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const img=$('#photoPreview');img.src=URL.createObjectURL(file);img.hidden=false;toast('Photo preview added — type the food name for an estimate')};document.querySelectorAll('[data-pickfood]').forEach(b=>b.onclick=()=>{$('#aiFood').value=b.dataset.pickfood;$('#aiOutput').innerHTML='';$('#aiGrams').focus()});$('#estimateFood').onclick=()=>{const query=$('#aiFood').value.trim().toLowerCase(),grams=Number($('#aiGrams').value);const selected=foodData.find(f=>f.name.toLowerCase()===query||f.aliases.some(a=>a===query))||foodData.find(f=>f.name.toLowerCase().includes(query)||f.aliases.some(a=>a.includes(query)||query.includes(a)));if(!query){toast('Enter a food first');return}if(!grams||grams<1||grams>3000){toast('Enter a portion from 1 to 3,000 grams');return}if(!selected){$('#aiOutput').innerHTML=`<div class="airesult"><h3>Food not in the quick list</h3><p class="small">Try a simpler name such as chicken, rice, pasta, bread or egg. This estimator uses a built-in list.</p></div>`;return}const factor=grams/100,n={kcal:Math.round(selected.kcal*factor),p:selected.p*factor,c:selected.c*factor,f:selected.f*factor};$('#aiOutput').innerHTML=`<div class="airesult"><h3>${esc(selected.name)} · ${grams}g</h3><div class="big">${n.kcal.toLocaleString()} kcal</div>${macroBoxes(n)}<p class="small">Approximate values per ${grams}g portion.</p><button class="btn full" id="saveEstimate">＋ Save to food diary</button></div>`;$('#saveEstimate').onclick=()=>{log().push({name:`${selected.name} (${grams}g)`,kcal:n.kcal,p:Math.round(n.p*10)/10,c:Math.round(n.c*10)/10,f:Math.round(n.f*10)/10,type:$('#aiMealType').value});save();toast('Meal saved to your diary');aiPage()}}}

function history(){let days=Object.keys(db.logs).filter(d=>db.logs[d]?.length).sort().reverse();$('#app').innerHTML=`<div class="sectiontitle">Your history</div><p class="sectiondesc">Look back at the days you've logged.</p><section class="panel"><div class="panel-head"><h2>Daily food log</h2><span class="small">${days.length} days logged</span></div>${days.length?days.map(d=>`<div class="historyday"><div class="historyhead"><span>${dayName(d)}</span><span>${total(d).toLocaleString()} kcal</span></div><div class="small">${db.logs[d].length} entries · target ${Number(db.target).toLocaleString()} kcal</div><div class="bar"><span style="width:${Math.min(100,total(d)/(Number(db.target)||2000)*100)}%"></span></div><button class="btn outline" style="margin-top:9px;padding:8px 11px" data-viewday="${d}">View this day</button></div>`).join(''):'<div class="empty">Your past days will appear here after you log food.</div>'}</section><section class="panel"><h2>Habit streak snapshot</h2><p class="small">Habits checked today: ${habits().length} of ${db.habits.length}</p></section>`;document.querySelectorAll('[data-viewday]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.viewday;tab='today';render();toast('Showing '+dayName(selectedDate))})}function habitPage(){$('#app').innerHTML=`<div class="sectiontitle">Daily habits</div><p class="sectiondesc">Progress, not perfection. Tick what you complete.</p><section class="panel"><div class="panel-head"><h2>For today</h2><span class="pill">${habits().length}/${db.habits.length} done</span></div>${db.habits.map(h=>habitRow(h)).join('')}<div class="bar"><span style="width:${db.habits.length?habits().length/db.habits.length*100:0}%"></span></div></section><section class="panel"><h2>Your habit list</h2><p class="small">Add habits that work for your routine.</p><form id="habitForm"><div class="field"><label for="habitName">New habit</label><input id="habitName" required maxlength="55" placeholder="e.g. Take a short walk"></div><button class="btn full">＋ Add habit</button></form>${db.habits.map(h=>`<div class="habit"><span style="font-size:20px">${h.emoji}</span><span class="habittext">${esc(h.name)}</span><button class="delete" data-delhabit="${h.id}" aria-label="Delete habit">×</button></div>`).join('')}</section>`;bindChecks();$('#habitForm').onsubmit=e=>{e.preventDefault();db.habits.push({id:'h'+Date.now(),name:$('#habitName').value.trim(),emoji:'🌱'});save();render();toast('Habit added')};document.querySelectorAll('[data-delhabit]').forEach(b=>b.onclick=()=>{db.habits=db.habits.filter(h=>h.id!==b.dataset.delhabit);Object.values(db.habitLogs).forEach(a=>{let i=a.indexOf(b.dataset.delhabit);if(i>=0)a.splice(i,1)});save();render()})}function moneyPage(){const money=db.money||(db.money={transactions:[],monthlyBudget:0,startingBalance:0}),tx=money.transactions||[],month=iso().slice(0,7),monthly=tx.filter(t=>String(t.date||'').startsWith(month)),income=monthly.filter(t=>t.type==='income').reduce((a,t)=>a+Number(t.amount||0),0),expenses=monthly.filter(t=>t.type==='expense').reduce((a,t)=>a+Number(t.amount||0),0),allBalance=Number(money.startingBalance||0)+tx.reduce((a,t)=>a+(t.type==='income'?1:-1)*Number(t.amount||0),0),budget=Number(money.monthlyBudget||0),remaining=budget-expenses;const eur=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(Number(n)||0);const cats=['Food & groceries','Rent & bills','Transport','Health','Shopping','Entertainment','Savings','Income','Other'];$('#app').innerHTML=`<div class="sectiontitle">Money Manager €</div><p class="sectiondesc">Track money coming in and going out, set a monthly spending limit, and see what is left. Data stays on this device.</p><section class="panel"><div class="panel-head"><h2>Money overview</h2><span class="pill">${new Date().toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span></div><div class="moneycards"><div class="moneycard"><span>Overall balance*</span><b>${eur(allBalance)}</b></div><div class="moneycard"><span>Income this month</span><b>${eur(income)}</b></div><div class="moneycard"><span>Spent this month</span><b>${eur(expenses)}</b></div><div class="moneycard ${remaining<0?'negative':''}"><span>${budget>0?'Budget left this month':'Monthly budget not set'}</span><b>${budget>0?eur(remaining):'—'}</b></div></div><p class="small" style="margin-top:10px">*Balance is calculated from the starting balance plus all transactions you record here. It is not linked to your bank.</p></section><section class="panel"><h2>Monthly spending limit</h2><p class="small">Set how much you want to spend this month (income is tracked separately).</p><div class="field"><label for="monthlyBudget">Budget for expenses (€)</label><input id="monthlyBudget" type="number" min="0" max="1000000" step="0.01" inputmode="decimal" value="${budget||''}" placeholder="e.g. 800"></div><div class="field"><label for="startingBalance">Starting balance (€)</label><input id="startingBalance" type="number" min="-1000000" max="1000000" step="0.01" inputmode="decimal" value="${Number(money.startingBalance)||0}"></div><button class="btn secondary full" id="saveMoneySettings">Save budget and starting balance</button>${budget>0?`<div class="bar"><span style="width:${Math.max(0,Math.min(100,expenses/budget*100))}%;background:${expenses>budget?'#d98568':'var(--green)'}"></span></div><p class="small">${Math.round(expenses/budget*100)}% of your monthly expense budget used.</p>`:''}</section><section class="panel"><h2>Add transaction</h2><form id="transactionForm"><div class="grid2"><div class="field"><label for="txType">Type</label><select id="txType"><option value="expense">Expense — money out</option><option value="income">Income — money in</option></select></div><div class="field"><label for="txAmount">Amount (€)</label><input id="txAmount" type="number" min="0.01" max="1000000" step="0.01" required inputmode="decimal" placeholder="25.00"></div></div><div class="field"><label for="txName">What was it?</label><input id="txName" required maxlength="80" placeholder="e.g. groceries, wages, bus fare"></div><div class="grid2"><div class="field"><label for="txCategory">Category</label><select id="txCategory">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label for="txDate">Date</label><input id="txDate" type="date" required value="${iso()}"></div></div><button class="btn full">＋ Add transaction</button></form></section><section class="panel"><div class="panel-head"><h2>This month's transactions</h2><span class="pill">${monthly.length} entries</span></div>${monthly.length?monthly.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.id||0)-(a.id||0)).map(t=>`<div class="transaction"><div class="transactionicon">${t.type==='income'?'↙':'↗'}</div><div class="transactioninfo"><b>${esc(t.name)}</b><span>${esc(t.category||'Other')} · ${esc(t.date||'')}</span></div><div class="transactionamount ${t.type==='income'?'income':''}">${t.type==='income'?'+':'−'}${eur(t.amount)}</div><button class="delete" data-deltx="${t.id}" aria-label="Delete transaction">×</button></div>`).join(''):'<div class="empty">No transactions this month yet. Add your first income or expense above.</div>'}</section><section class="panel"><h2>Export your money records</h2><p class="small">Download a CSV of all money transactions to keep a backup or open it in a spreadsheet.</p><button class="btn outline full" id="exportMoney">Export transactions as CSV</button></section>`;$('#saveMoneySettings').onclick=()=>{const b=Number($('#monthlyBudget').value),s=Number($('#startingBalance').value);if(b<0||s<-1000000||s>1000000){toast('Check the amounts and try again');return}money.monthlyBudget=b;money.startingBalance=s;save();moneyPage();toast('Money settings saved')};$('#transactionForm').onsubmit=e=>{e.preventDefault();const amount=Number($('#txAmount').value),name=$('#txName').value.trim();if(!Number.isFinite(amount)||amount<=0||!name){toast('Enter a name and amount above zero');return}money.transactions.push({id:Date.now(),type:$('#txType').value,amount:Math.round(amount*100)/100,name,category:$('#txCategory').value,date:$('#txDate').value||iso()});save();moneyPage();toast('Transaction added')};document.querySelectorAll('[data-deltx]').forEach(b=>b.onclick=()=>{if(confirm('Delete this transaction?')){money.transactions=money.transactions.filter(t=>String(t.id)!==b.dataset.deltx);save();moneyPage();toast('Transaction deleted')}});$('#exportMoney').onclick=()=>{const rows=[['Date','Type','Name','Category','Amount (€)'],...tx.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(t=>[t.date,t.type,t.name,t.category,t.amount])],csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='nourish-money-'+iso()+'.csv';a.click();URL.revokeObjectURL(url)}}
function calc(){let p=db.profile;let bmr=10*Number(p.weight)+6.25*Number(p.height)-5*Number(p.age)+(p.sex==='male'?5:-161);let maintenance=Math.round(bmr*Number(p.activity));return Math.max(1200,Math.round((p.goal==='lose'?maintenance-350:p.goal==='gain'?maintenance+250:maintenance)/50)*50)}function profilePage(){let p=db.profile;$('#app').innerHTML=`<div class="sectiontitle">Your profile</div><p class="sectiondesc">Personalise your calorie estimate and daily goal.</p><section class="panel"><form id="profileForm"><div class="field"><label for="pname">Name (optional)</label><input id="pname" maxlength="35" value="${esc(p.name)}" placeholder="What should we call you?"></div><div class="grid2"><div class="field"><label for="sex">Calculation setting</label><select id="sex"><option value="male" ${p.sex==='male'?'selected':''}>Male</option><option value="female" ${p.sex==='female'?'selected':''}>Female</option></select></div><div class="field"><label for="age">Age</label><input id="age" type="number" min="18" max="100" required value="${p.age}" inputmode="numeric"></div><div class="field"><label for="height">Height (cm)</label><input id="height" type="number" min="120" max="230" required value="${p.height}" inputmode="numeric"></div><div class="field"><label for="weight">Weight (kg)</label><input id="weight" type="number" min="30" max="350" required value="${p.weight}" step="0.1" inputmode="decimal"></div></div><div class="field"><label for="activity">Activity level</label><select id="activity"><option value="1.2" ${p.activity==1.2?'selected':''}>Mostly sitting / little exercise</option><option value="1.375" ${p.activity==1.375?'selected':''}>Lightly active</option><option value="1.55" ${p.activity==1.55?'selected':''}>Moderately active</option><option value="1.725" ${p.activity==1.725?'selected':''}>Very active</option></select></div><div class="field"><label for="goal">Goal</label><select id="goal"><option value="lose" ${p.goal==='lose'?'selected':''}>Lose weight gradually</option><option value="maintain" ${p.goal==='maintain'?'selected':''}>Maintain weight</option><option value="gain" ${p.goal==='gain'?'selected':''}>Gain weight</option></select></div><button class="btn full">Save profile & calculate</button></form></section><section class="panel"><div class="panel-head"><h2>Daily calorie target</h2><span class="pill">Estimate</span></div><div class="big">${Number(db.target).toLocaleString()} kcal</div><p class="small">Estimated using the Mifflin–St Jeor equation and your activity selection. This is a starting estimate, not medical advice.</p><button class="btn secondary full" id="recalc">Recalculate from profile</button><div class="field"><label for="customTarget">Or set your own daily target (kcal)</label><input id="customTarget" type="number" min="1000" max="6000" value="${db.target}" inputmode="numeric"></div><button class="btn outline full" id="customSave">Save custom target</button></section><section class="panel"><h2>Your data</h2><p class="small">Your information is stored in this browser on this device. Clearing website data can erase it, so export a backup occasionally.</p><div class="footerbuttons"><button class="btn secondary" id="export">Export backup</button><label class="btn outline" for="importFile">Import backup</label><input id="importFile" type="file" accept="application/json" hidden></div><p style="margin-top:14px"><button class="btn outline danger" id="reset">Reset all app data</button></p></section>`;$('#profileForm').onsubmit=e=>{e.preventDefault();Object.assign(p,{name:$('#pname').value.trim(),sex:$('#sex').value,age:Number($('#age').value),height:Number($('#height').value),weight:Number($('#weight').value),activity:Number($('#activity').value),goal:$('#goal').value});db.target=calc();save();render();toast('Profile saved')};$('#recalc').onclick=()=>{db.target=calc();save();render();toast('Calorie target updated')};$('#customSave').onclick=()=>{let n=Number($('#customTarget').value);if(n>=1000&&n<=6000){db.target=n;save();render();toast('Daily target saved')}else toast('Enter a target between 1,000 and 6,000')};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nourish-backup-'+iso()+'.json';a.click();URL.revokeObjectURL(url)};$('#importFile').onchange=async e=>{try{let imported=JSON.parse(await e.target.files[0].text());if(!imported.profile||!imported.logs)throw 0;db=imported;save();render();toast('Backup restored')}catch(err){toast('That backup file could not be read')}};$('#reset').onclick=()=>{if(confirm('Delete all Nourish data on this device? Export a backup first if you want to keep it.')){db=defaults();save();render();toast('App data reset')}}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
