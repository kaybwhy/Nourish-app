<style>

ound:var(--forest);color:white;font-weight:650}.btn.secondary{background:var(--mint);color:var(--forest)}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.full{width:100%}.meal{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.meal:last-child{border-bottom:0}.mealicon{width:40px;height:40px;border-radius:13px;background:#edf4ec;display:grid;place-items:center;font-size:20px}.mealinfo{flex:1;min-width:0}.mealinfo b{display:block;font-size:14px;overflow-wrap:anywhere}.mealinfo span{font-size:12px;color:var(--muted)}.kcal{font-weight:750;font-size:14px;white-space:nowrap}.delete{background:none;border:0;color:#9b7569;font-size:20px;padding:5px}.habit{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}.habit:last-child{border:0}.check{width:25px;height:25px;border-radius:8px;border:1.5px solid #bdc9bf;background:white;display:grid;place-items:center;color:white;flex-shrink:0}.check.on{background:var(--green);border-color:var(--green)}.habittext{flex:1;font-size:14px}.habittext.done{text-decoration:line-through;color:var(--muted)}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:9px 8px calc(8px + env(safe-area-inset-bottom));background:#fffef9ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around}.tab{border:0;background:none;color:#7a8980;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:58px;padding:4px}.tab .ico{font-size:21px}.tab.active{color:var(--forest);font-weight:750}.sectiontitle{font-size:25px;font-weight:800;letter-spacing:-.8px;margin:5px 0 5px}.sectiondesc{font-size:13px;color:var(--muted);margin:0 0 17px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;color:#5e6d64;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #dce4db;border-radius:12px;background:white;color:var(--ink)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.foodrow{display:grid;grid-template-columns:1fr 90px;gap:10px}.empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:13px}.pill{background:var(--mint);color:var(--forest);font-size:11px;font-weight:700;padding:5px 8px;border-radius:20px}.bar{height:8px;background:#e7ece5;border-radius:9px;overflow:hidden;margin-top:8px}.bar span{height:100%;display:block;background:var(--green);border-radius:9px}.historyday{padding:13px 0;border-bottom:1px solid var(--line)}.historyday:last-child{border:0}.historyhead{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.muted{color:var(--muted)}.notice{font-size:12px;line-height:1.5;color:var(--muted);background:#f0f4ee;padding:11px;border-radius:12px}.toast{position:fixed;top:15px;left:15px;right:15px;background:var(--forest);color:white;padding:12px 15px;border-radius:13px;z-index:20;display:none}.danger{color:#a84f3a}.footerbuttons{display:flex;gap:9px;flex-wrap:wrap}.macrogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.macrobox{background:#f0f4ee;border-radius:12px;padding:10px 7px;text-align:center}.macrobox b{display:block;font-size:17px}.macrobox span{font-size:10px;color:var(--muted)}.uploadbox{border:1.5px dashed #b8cbbd;border-radius:15px;padding:14px;text-align:center;background:#fbfcf8}.uploadbox img{display:block;max-width:100%;max-height:220px;margin:12px auto 0;border-radius:12px}.airesult{background:#f0f4ee;border-radius:15px;padding:14px;margin-top:12px}.airesult h3{margin:0 0 5px;font-size:16px}.tagrow{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;background:#e3eee4;border-radius:20px;padding:5px 8px;color:var(--forest)}@media(max-width:380px){.tab{min-width:52px;font-size:10px}.tab .ico{font-size:19px}.macrogrid{gap:5px}.macrobox{padding:8px 4px}.macrobox b{font-size:15px}}
.authwrap{max-width:430px;margin:26px auto;padding:0 16px}.authpanel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 3px 14px #163f3508}.authpanel h2{font-size:23px;margin:0 0 7px}.authswitch{display:flex;gap:8px;margin:15px 0}.authswitch button{flex:1}.authmessage{font-size:13px;line-height:1.5;margin:12px 0;padding:10px;border-radius:12px;background:#f0f4ee}.adminrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.adminrow:last-child{border:0}.syncstatus{font-size:12px;color:var(--muted);margin-top:8px}.hidden{display:none!important}</style></head><body><header class="top"><div class="brand"><div class="logo">✳</div><div><h1>Nourish</h1><div class="date" id="todayDate"></div></div></div><div class="greeting" id="greeting">Small steps, every day.</div><div class="sub">Care for your body, one choice at a time.</div></header><main class="wrap" id="app"></main><nav class="tabs"><button class="tab active" data-tab="today"><span class="ico">◉</span>Today</button><button class="tab" data-tab="history"><span class="ico">▤</span>History</button><button class="tab" data-tab="habits"><span class="ico">✓</span>Habits</button><button class="tab" data-tab="ai"><span class="ico">✦</span>AI Food</button><button class="tab" data-tab="profile"><span class="ico">☺</span>Profile</button><button class="tab hidden" id="adminTab" data-tab="admin"><span class="ico">♙</span>Admin</button></nav><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=s=>document.querySelector(s);const iso=()=>new Date().toLocaleDateString('en-CA');const dayName=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
// Public browser settings only. Never put a Supabase service-role key here.
const SUPABASE_URL='PASTE_YOUR_SUPABASE_PROJECT_URL_HERE';const SUPABASE_ANON_KEY='PASTE_YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY_HERE';const ADMIN_EMAIL='YOUR_ADMIN_EMAIL_HERE'.toLowerCase();
const cloudReady=()=>window.supabase&&SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('PASTE_')&&!SUPABASE_ANON_KEY.includes('PASTE_');const sb=cloudReady()?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const defaults=()=>({profile:{name:'',sex:'male',age:22,height:178,weight:88,goal:'maintain',activity:1.2},target:2200,logs:{},habits:[{id:'water',name:'Drink enough water',emoji:'💧'},{id:'food',name:'Eat regular meals',emoji:'🥣'},{id:'walk',name:'Get some movement',emoji:'🚶'},{id:'sleep',name:'Wind down for sleep',emoji:'🌙'}],habitLogs:{}});
let db;try{db=JSON.parse(localStorage.getItem('nourishDB'))||defaults()}catch(e){db=defaults()}let tab='today';let selectedDate=iso();let currentUser=null;let legacyMigrated=false;let syncTimer=null;let cloudBusy=false;let authMode='login';let authMessage='';const legacyDb=(()=>{try{return JSON.parse(localStorage.getItem('nourishDB'))}catch(e){return null}})();
function storageKey(){return currentUser?'nourishDB_'+currentUser.id:'nourishDB'}
function save(){try{localStorage.setItem(storageKey(),JSON.stringify(db))}catch(e){}if(sb&&currentUser){$('#syncStatus')&&($('#syncStatus').textContent='Syncing to your account…');clearTimeout(syncTimer);syncTimer=setTimeout(syncCloud,500)}}
async function syncCloud(){if(!sb||!currentUser||cloudBusy)return;cloudBusy=true;try{const {error}=await sb.from('user_data').upsert({user_id:currentUser.id,data:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;const s=$('#syncStatus');if(s)s.textContent='✓ Synced to your account'}catch(e){const s=$('#syncStatus');if(s)s.textContent='Cloud sync needs attention: '+(e.message||'check Supabase setup')}finally{cloudBusy=false}}
function log(d=selectedDate){if(!db.logs[d])db.logs[d]=[];return db.logs[d]}function habits(d=iso()){if(!db.habitLogs[d])db.habitLogs[d]=[];return db.habitLogs[d]}function total(d=selectedDate){return log(d).reduce((a,f)=>a+Number(f.kcal||0),0)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#todayDate').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});$('#greeting').textContent=db.profile.name?`You've got this, ${db.profile.name}.`:'Small steps, every day.';if(tab==='today')today();if(tab==='history')history();if(tab==='habits')habitPage();if(tab==='ai')aiPage();if(tab==='profile')profilePage();if(tab==='admin')adminPage()}function today(){let t=total(),target=Number(db.target)||2000,p=Math.min(100,t/target*100),remaining=target-t;$('#app').innerHTML=`<section class="panel"><div class="panel-head"><h2>Today's calories</h2><span class="pill">${remaining>=0?remaining+' left':Math.abs(remaining)+' over'}</span></div><div class="calrow"><div class="ring" style="--p:${p}%"><div class="ringinner"><div class="big">${t.toLocaleString()}</div><div class="ringlabel">kcal eaten</div></div></div><div class="stats"><div class="stat"><b>${target.toLocaleString()}</b><span>Daily target</span></div><div class="stat"><b>${log().length}</b><span>Food entries</span></div><div class="stat"><b>${habits().length}/${db.habits.length}</b><span>Habits done</span></div></div></div><div class="bar"><span style="width:${p}%"></span></div></section><section class="panel"><div class="panel-head"><h2>Food diary</h2><span class="small">${dayName(selectedDate)}</span></div><form id="foodForm"><div class="field"><label for="foodName">What did you eat?</label><input id="foodName" required maxlength="90" placeholder="e.g. Chicken and rice"></div><div class="foodrow"><div class="field"><label for="foodKcal">Calories (kcal)</label><input id="foodKcal" required type="number" min="0" max="10000" inputmode="numeric" placeholder="450"></div><div class="field"><label for="mealType">Meal</label><select id="mealType"><option>Meal</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option><option>Drink</option></select></div></div><button class="btn full">＋ Add food</button></form><div style="margin-top:8px">${log().length?log().map((f,i)=>`<div class="meal"><div class="mealicon">${({Breakfast:'🍳',Lunch:'🥪',Dinner:'🍽️',Snack:'🍎',Drink:'🥤',Meal:'🥣'})[f.type]||'🥣'}</div><div class="mealinfo"><b>${esc(f.name)}</b><span>${esc(f.type||'Meal')}${f.p!=null?` · P ${Math.round(f.p)}g · C ${Math.round(f.c||0)}g · F ${Math.round(f.f||0)}g`:``}</span></div><div class="kcal">${Number(f.kcal).toLocaleString()} kcal</div><button class="delete" aria-label="Delete food" data-delete="${i}">×</button></div>`).join(''):'<div class="empty">Your diary is waiting. Add your first meal above.</div>'}</div></section><section class="panel"><div class="panel-head"><h2>Today's habits</h2><button class="btn secondary" id="goHabits">View all</button></div>${db.habits.slice(0,3).map(h=>habitRow(h)).join('')}</section>`;$('#foodForm').onsubmit=e=>{e.preventDefault();log().push({name:$('#foodName').value.trim(),kcal:Number($('#foodKcal').value),type:$('#mealType').value});save();render();toast('Added to your diary')};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{log().splice(Number(b.dataset.delete),1);save();render()});$('#goHabits').onclick=()=>{tab='habits';render()};bindChecks()}function habitRow(h){let done=habits().includes(h.id);return `<div class="habit"><button class="check ${done?'on':''}" data-habit="${h.id}" aria-label="Toggle ${esc(h.name)}">${done?'✓':''}</button><div class="habittext ${done?'done':''}">${h.emoji} &nbsp;${esc(h.name)}</div></div>`}function bindChecks(){document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{let id=b.dataset.habit,a=habits(),i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();render()})}
const foodData=[
{name:'Chicken breast, cooked',aliases:['chicken','chicken breast','grilled chicken'],kcal:165,p:31,c:0,f:3.6},
{name:'White rice, cooked',aliases:['rice','white rice'],kcal:130,p:2.7,c:28,f:.3},
{name:'Pasta, cooked',aliases:['pasta','spaghetti','penne'],kcal:158,p:5.8,c:30.9,f:.9},
{name:'Egg, whole',aliases:['egg','eggs'],kcal:155,p:13,c:1.1,f:11},
{name:'White bread',aliases:['bread','toast','white toast'],kcal:265,p:9,c:49,f:3.2},
{name:'Oats, dry',aliases:['oats','porridge','oatmeal'],kcal:389,p:16.9,c:66.3,f:6.9},
{name:'Banana',aliases:['banana'],kcal:89,p:1.1,c:22.8,f:.3},
{name:'Apple',aliases:['apple'],kcal:52,p:.3,c:13.8,f:.2},
{name:'Potato, boiled',aliases:['potato','potatoes','boiled potato'],kcal:87,p:1.9,c:20.1,f:.1},
{name:'Salmon, cooked',aliases:['salmon'],kcal:206,p:22,c:0,f:12},
{name:'Beef mince, cooked',aliases:['beef','mince','beef mince'],kcal:250,p:26,c:0,f:15},
{name:'Cheddar cheese',aliases:['cheese','cheddar'],kcal:403,p:25,c:1.3,f:33},
{name:'Greek yoghurt',aliases:['greek yoghurt','greek yogurt','yoghurt','yogurt'],kcal:97,p:9,c:3.9,f:5},
{name:'Whole milk',aliases:['milk'],kcal:61,p:3.2,c:4.8,f:3.3},
{name:'Peanut butter',aliases:['peanut butter'],kcal:588,p:25,c:20,f:50},
{name:'Oven chips',aliases:['chips','fries','oven chips'],kcal:180,p:3,c:28,f:6},
{name:'Pizza',aliases:['pizza'],kcal:266,p:11,c:33,f:10},
{name:'Burger, beef',aliases:['burger','beef burger'],kcal:295,p:17,c:24,f:14},
{name:'Broccoli',aliases:['broccoli'],kcal:35,p:2.4,c:7.2,f:.4},
{name:'Baked beans',aliases:['beans','baked beans'],kcal:82, p:4.8,c:14,f:.5}
];

function macroTotals(d=selectedDate){return log(d).reduce((a,f)=>({p:a.p+Number(f.p||0),c:a.c+Number(f.c||0),f:a.f+Number(f.f||0)}),{p:0,c:0,f:0})}
function macroBoxes(m){return `<div class="macrogrid"><div class="macrobox"><b>${Math.round(m.p)}g</b><span>PROTEIN</span></div><div class="macrobox"><b>${Math.round(m.c)}g</b><span>CARBS</span></div><div class="macrobox"><b>${Math.round(m.f)}g</b><span>FAT</span></div><div class="macrobox"><b>${Math.round(m.p*4+m.c*4+m.f*9)}</b><span>MACRO KCAL</span></div></div>`}
function aiPage(){let m=macroTotals();$('#app').innerHTML=`<div class="sectiontitle">AI Food Assistant ✦</div><p class="sectiondesc">Estimate calories and macros, then save them straight to your food diary.</p><section class="panel"><div class="panel-head"><h2>Today's macros</h2><span class="pill">From logged meals</span></div>${macroBoxes(m)}<p class="small">Only entries with macro data are included. Estimates are approximate.</p></section><section class="panel"><div class="panel-head"><h2>Scan or describe food</h2><span class="pill">Food estimator</span></div><div class="uploadbox"><div style="font-size:30px">📷</div><b>Add a food photo</b><p class="small">Choose a photo to preview it, then select the closest food below.</p><input id="foodPhoto" type="file" accept="image/*" capture="environment" style="max-width:100%;font-size:12px"><img id="photoPreview" hidden alt="Selected food preview"></div><div class="field"><label for="aiFood">Food or meal</label><input id="aiFood" list="foodOptions" placeholder="e.g. chicken, rice, banana"><datalist id="foodOptions">${foodData.map(f=>`<option value="${esc(f.name)}">`).join('')}</datalist></div><div class="grid2"><div class="field"><label for="aiGrams">Portion (grams)</label><input id="aiGrams" type="number" min="1" max="3000" value="150" inputmode="numeric"></div><div class="field"><label for="aiMealType">Meal type</label><select id="aiMealType"><option>Meal</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option><option>Drink</option></select></div></div><button class="btn full" id="estimateFood">Estimate nutrition</button><div id="aiOutput"></div></section><section class="panel"><h2>Quick food lookup</h2><p class="small">Pick a common food to fill in the estimator.</p><div class="tagrow">${foodData.slice(0,14).map(f=>`<button class="tag" data-pickfood="${esc(f.name)}" style="border:0">${esc(f.name)}</button>`).join('')}</div></section><div class="notice">Nutrition estimates vary by brand, recipe and cooking method. This version uses a built-in food reference table; the photo is not automatically recognised by an AI model yet. Automatic photo recognition and open-ended AI chat need a secure AI service connection.</div>`;
let selected=null;$('#foodPhoto').onchange=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const img=$('#photoPreview');img.src=URL.createObjectURL(file);img.hidden=false;toast('Photo added — select the closest food below')};document.querySelectorAll('[data-pickfood]').forEach(b=>b.onclick=()=>{$('#aiFood').value=b.dataset.pickfood;$('#aiOutput').innerHTML='';$('#aiGrams').focus()});$('#estimateFood').onclick=()=>{const query=$('#aiFood').value.trim().toLowerCase(),grams=Number($('#aiGrams').value);selected=foodData.find(f=>f.name.toLowerCase()===query||f.aliases.some(a=>a===query))||foodData.find(f=>f.name.toLowerCase().includes(query)||f.aliases.some(a=>a.includes(query)||query.includes(a)));if(!query){toast('Enter a food first');return}if(!grams||grams<1||grams>3000){toast('Enter a portion from 1 to 3,000 grams');return}if(!selected){$('#aiOutput').innerHTML=`<div class="airesult"><h3>Food not in the quick list</h3><p class="small">Try a simpler name such as chicken, rice, pasta, bread or egg. This first version estimates from a built-in list.</p></div>`;return}const factor=grams/100,n={kcal:Math.round(selected.kcal*factor),p:selected.p*factor,c:selected.c*factor,f:selected.f*factor};$('#aiOutput').innerHTML=`<div class="airesult"><h3>${esc(selected.name)} · ${grams}g</h3><div class="big">${n.kcal.toLocaleString()} kcal</div>${macroBoxes(n)}<p class="small">Approximate values per ${grams}g portion.</p><button class="btn full" id="saveEstimate">＋ Save to food diary</button></div>`;$('#saveEstimate').onclick=()=>{log().push({name:`${selected.name} (${grams}g)`,kcal:n.kcal,p:Math.round(n.p*10)/10,c:Math.round(n.c*10)/10,f:Math.round(n.f*10)/10,type:$('#aiMealType').value});save();toast('Meal saved to your diary');aiPage()}}}

function history(){let days=Object.keys(db.logs).filter(d=>db.logs[d]?.length).sort().reverse();$('#app').innerHTML=`<div class="sectiontitle">Your history</div><p class="sectiondesc">Look back at the days you've logged.</p><section class="panel"><div class="panel-head"><h2>Daily food log</h2><span class="small">${days.length} days logged</span></div>${days.length?days.map(d=>`<div class="historyday"><div class="historyhead"><span>${dayName(d)}</span><span>${total(d).toLocaleString()} kcal</span></div><div class="small">${db.logs[d].length} entries · target ${Number(db.target).toLocaleString()} kcal</div><div class="bar"><span style="width:${Math.min(100,total(d)/(Number(db.target)||2000)*100)}%"></span></div><button class="btn outline" style="margin-top:9px;padding:8px 11px" data-viewday="${d}">View this day</button></div>`).join(''):'<div class="empty">Your past days will appear here after you log food.</div>'}</section><section class="panel"><h2>Habit streak snapshot</h2><p class="small">Habits checked today: ${habits().length} of ${db.habits.length}</p></section>`;document.querySelectorAll('[data-viewday]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.viewday;tab='today';render();toast('Showing '+dayName(selectedDate))})}function habitPage(){$('#app').innerHTML=`<div class="sectiontitle">Daily habits</div><p class="sectiondesc">Progress, not perfection. Tick what you complete.</p><section class="panel"><div class="panel-head"><h2>For today</h2><span class="pill">${habits().length}/${db.habits.length} done</span></div>${db.habits.map(h=>habitRow(h)).join('')}<div class="bar"><span style="width:${db.habits.length?habits().length/db.habits.length*100:0}%"></span></div></section><section class="panel"><h2>Your habit list</h2><p class="small">Add habits that work for your routine.</p><form id="habitForm"><div class="field"><label for="habitName">New habit</label><input id="habitName" required maxlength="55" placeholder="e.g. Take a short walk"></div><button class="btn full">＋ Add habit</button></form>${db.habits.map(h=>`<div class="habit"><span style="font-size:20px">${h.emoji}</span><span class="habittext">${esc(h.name)}</span><button class="delete" data-delhabit="${h.id}" aria-label="Delete habit">×</button></div>`).join('')}</section>`;bindChecks();$('#habitForm').onsubmit=e=>{e.preventDefault();db.habits.push({id:'h'+Date.now(),name:$('#habitName').value.trim(),emoji:'🌱'});save();render();toast('Habit added')};document.querySelectorAll('[data-delhabit]').forEach(b=>b.onclick=()=>{db.habits=db.habits.filter(h=>h.id!==b.dataset.delhabit);Object.values(db.habitLogs).forEach(a=>{let i=a.indexOf(b.dataset.delhabit);if(i>=0)a.splice(i,1)});save();render()})}function calc(){let p=db.profile;let bmr=10*Number(p.weight)+6.25*Number(p.height)-5*Number(p.age)+(p.sex==='male'?5:-161);let maintenance=Math.round(bmr*Number(p.activity));return Math.max(1200,Math.round((p.goal==='lose'?maintenance-350:p.goal==='gain'?maintenance+250:maintenance)/50)*50)}function profilePage(){let p=db.profile;$('#app').innerHTML=`<div class="sectiontitle">Your profile</div><p class="sectiondesc">Personalise your calorie estimate and daily goal.</p><section class="panel"><form id="profileForm"><div class="field"><label for="pname">Name (optional)</label><input id="pname" maxlength="35" value="${esc(p.name)}" placeholder="What should we call you?"></div><div class="grid2"><div class="field"><label for="sex">Calculation setting</label><select id="sex"><option value="male" ${p.sex==='male'?'selected':''}>Male</option><option value="female" ${p.sex==='female'?'selected':''}>Female</option></select></div><div class="field"><label for="age">Age</label><input id="age" type="number" min="18" max="100" required value="${p.age}" inputmode="numeric"></div><div class="field"><label for="height">Height (cm)</label><input id="height" type="number" min="120" max="230" required value="${p.height}" inputmode="numeric"></div><div class="field"><label for="weight">Weight (kg)</label><input id="weight" type="number" min="30" max="350" required value="${p.weight}" step="0.1" inputmode="decimal"></div></div><div class="field"><label for="activity">Activity level</label><select id="activity"><option value="1.2" ${p.activity==1.2?'selected':''}>Mostly sitting / little exercise</option><option value="1.375" ${p.activity==1.375?'selected':''}>Lightly active</option><option value="1.55" ${p.activity==1.55?'selected':''}>Moderately active</option><option value="1.725" ${p.activity==1.725?'selected':''}>Very active</option></select></div><div class="field"><label for="goal">Goal</label><select id="goal"><option value="lose" ${p.goal==='lose'?'selected':''}>Lose weight gradually</option><option value="maintain" ${p.goal==='maintain'?'selected':''}>Maintain weight</option><option value="gain" ${p.goal==='gain'?'selected':''}>Gain weight</option></select></div><button class="btn full">Save profile & calculate</button></form></section><section class="panel"><div class="panel-head"><h2>Daily calorie target</h2><span class="pill">Estimate</span></div><div class="big">${Number(db.target).toLocaleString()} kcal</div><p class="small">Estimated using the Mifflin–St Jeor equation and your activity selection. This is a starting estimate, not medical advice.</p><button class="btn secondary full" id="recalc">Recalculate from profile</button><div class="field"><label for="customTarget">Or set your own daily target (kcal)</label><input id="customTarget" type="number" min="1000" max="6000" value="${db.target}" inputmode="numeric"></div><button class="btn outline full" id="customSave">Save custom target</button></section><section class="panel"><div class="panel-head"><h2>Account & cloud sync</h2><span class="pill">${currentUser?'Signed in':'Local only'}</span></div><p class="small">${esc(currentUser?.email||'Sign in to back up your diary online and use it on another device.')}</p><p id="syncStatus" class="syncstatus">${sb?'Cloud sync is enabled.':'Supabase is not configured yet — local mode only.'}</p><button class="btn outline full" id="signOutBtn" ${currentUser?'':'hidden'}>Log out</button></section><section class="panel"><h2>Your data</h2><p class="small">Your information is stored in this browser and, when configured, synced to your private account in Supabase. Export a backup occasionally.</p><div class="footerbuttons"><button class="btn secondary" id="export">Export backup</button><label class="btn outline" for="importFile">Import backup</label><input id="importFile" type="file" accept="application/json" hidden></div><p style="margin-top:14px"><button class="btn outline danger" id="reset">Reset all app data</button></p></section>`;$('#profileForm').onsubmit=e=>{e.preventDefault();Object.assign(p,{name:$('#pname').value.trim(),sex:$('#sex').value,age:Number($('#age').value),height:Number($('#height').value),weight:Number($('#weight').value),activity:Number($('#activity').value),goal:$('#goal').value});db.target=calc();save();render();toast('Profile saved')};$('#recalc').onclick=()=>{db.target=calc();save();render();toast('Calorie target updated')};$('#customSave').onclick=()=>{let n=Number($('#customTarget').value);if(n>=1000&&n<=6000){db.target=n;save();render();toast('Daily target saved')}else toast('Enter a target between 1,000 and 6,000')};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nourish-backup-'+iso()+'.json';a.click();URL.revokeObjectURL(url)};$('#importFile').onchange=async e=>{try{let imported=JSON.parse(await e.target.files[0].text());if(!imported.profile||!imported.logs)throw 0;db=imported;save();render();toast('Backup restored')}catch(err){toast('That backup file could not be read')}};$('#reset').onclick=()=>{if(confirm('Delete all Nourish data on this device? Export a backup first if you want to keep it.')){db=defaults();save();render();toast('App data reset')}};const so=$('#signOutBtn');if(so)so.onclick=async()=>{if(sb)await sb.auth.signOut();currentUser=null;showAuth();toast('Logged out')}}function adminPage(){if(!currentUser||currentUser.email.toLowerCase()!==ADMIN_EMAIL||!sb){tab='today';render();return}$('#app').innerHTML=`<div class="sectiontitle">Admin dashboard</div><p class="sectiondesc">Account registrations for Nourish. Private to the admin email configured in the app and database policies.</p><section class="panel"><div class="panel-head"><h2>Registered users</h2><button class="btn secondary" id="refreshUsers">Refresh</button></div><div id="userList" class="empty">Loading registrations…</div><p class="small">This list shows account email and registration date only. It does not expose users’ passwords or food diaries.</p></section><section class="panel"><h2>Notifications</h2><p class="small">Email notifications are sent by the optional Supabase Edge Function when a new user signs up successfully. Configure RESEND_API_KEY and ADMIN_NOTIFICATION_EMAIL in Supabase secrets. See SETUP.md.</p></section>`;const load=async()=>{const el=$('#userList');el.textContent='Loading registrations…';const {data,error}=await sb.from('profiles').select('id,email,created_at').order('created_at',{ascending:false}).limit(500);if(error){el.textContent='Could not load users: '+error.message;return}el.className='';el.innerHTML=data.length?data.map(u=>`<div class="adminrow"><span>${esc(u.email||'No email')}<br><span class="small">Joined ${new Date(u.created_at).toLocaleString()}</span></span><span class="pill">Account</span></div>`).join(''):'No registrations yet.'};$('#refreshUsers').onclick=load;load()}function showAuth(){document.querySelector('.top').classList.add('hidden');document.querySelector('.tabs').classList.add('hidden');$('#app').classList.remove('wrap');$('#app').innerHTML=`<div class="authwrap"><div class="authpanel"><div class="brand" style="margin-bottom:18px"><div class="logo">✳</div><div><h1 style="color:var(--forest);margin:0">Nourish</h1><div class="small">Your food diary, habits and progress</div></div></div><h2>${authMode==='login'?'Welcome back':'Create your account'}</h2><p class="small">${authMode==='login'?'Log in to sync your diary across devices.':'Your account keeps your diary private and backed up.'}</p><form id="authForm"><div class="field"><label for="authEmail">Email address</label><input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="authPassword">Password (at least 8 characters)</label><input id="authPassword" type="password" autocomplete="${authMode==='login'?'current-password':'new-password'}" minlength="8" required placeholder="At least 8 characters"></div><button class="btn full" id="authSubmit">${authMode==='login'?'Log in':'Create account'}</button></form><div class="authswitch"><button class="btn outline" id="switchAuth">${authMode==='login'?'Need an account? Sign up':'Already registered? Log in'}</button></div><button class="btn outline full" id="forgotPassword">Forgot password?</button>${authMessage?`<div class="authmessage">${esc(authMessage)}</div>`:''}<p class="small" style="margin-top:16px">By continuing, you agree to use Nourish for personal tracking. Avoid entering information you do not want stored online. Your diary is private to your account.</p></div></div>`;$('#authForm').onsubmit=async e=>{e.preventDefault();if(!sb){authMessage='First configure the Supabase project URL and public anon/publishable key in index.html, then upload the files again.';showAuth();return}const email=$('#authEmail').value.trim(),password=$('#authPassword').value;const btn=$('#authSubmit');btn.disabled=true;btn.textContent='Please wait…';try{if(authMode==='signup'){const {data,error}=await sb.auth.signUp({email,password});if(error)throw error;if(data.session){await handleLogin(data.session.user)}else{authMessage='Account created. Check your email to confirm it, then return here and log in. To receive email notifications for confirmed-email sign-ups, use the optional webhook setup in SETUP.md; the simple in-app notifier runs when sign-up creates a session.';showAuth()}}else{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await handleLogin(data.user)}}catch(err){authMessage=err.message||'Could not complete that request.';showAuth()}};$('#switchAuth').onclick=()=>{authMode=authMode==='login'?'signup':'login';authMessage='';showAuth()};$('#forgotPassword').onclick=async()=>{if(!sb){authMessage='Configure Supabase first.';showAuth();return}const email=$('#authEmail').value.trim();if(!email){authMessage='Enter your email address above first.';showAuth();return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});authMessage=error?error.message:'If an account exists for that email, a password reset link will be sent.';showAuth()}}async function handleLogin(user){currentUser=user;const key=storageKey();let local=null;try{local=JSON.parse(localStorage.getItem(key))}catch(e){}const {data,error}=await sb.from('user_data').select('data').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data&&data.data){db=data.data;localStorage.setItem(key,JSON.stringify(db))}else{db=local||(!legacyMigrated?legacyDb:null)||defaults();if(!local&&legacyDb&&!legacyMigrated){localStorage.removeItem('nourishDB');legacyMigrated=true}await sb.from('user_data').upsert({user_id:user.id,data:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});localStorage.setItem(key,JSON.stringify(db))}document.querySelector('.top').classList.remove('hidden');document.querySelector('.tabs').classList.remove('hidden');$('#app').classList.add('wrap');$('#adminTab').classList.toggle('hidden',user.email.toLowerCase()!==ADMIN_EMAIL||ADMIN_EMAIL.includes('YOUR_ADMIN'));tab='today';authMessage='';render()}async function initAuth(){if(!sb){showAuth();return}const {data:{session}}=await sb.auth.getSession();if(session){try{await handleLogin(session.user)}catch(e){authMessage='Could not load cloud data: '+e.message;showAuth()}}else showAuth();sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){currentUser=null;showAuth()}else if(event==='PASSWORD_RECOVERY'){authMessage='Follow the password reset flow from your email.';showAuth()}})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});initAuth();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
